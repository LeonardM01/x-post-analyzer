<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Post Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      line-height: 1.6;
      padding: 24px 16px 64px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    header p {
      color: #555;
      font-size: 0.95rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 6px;
      color: #333;
    }

    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: #1d9bf0; }

    .media-group {
      margin-top: 18px;
    }

    .media-group label.group-label {
      margin-bottom: 8px;
    }

    .radio-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .radio-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .api-section {
      margin-top: 18px;
    }

    .api-section input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
      margin-top: 6px;
    }

    .api-section input[type="password"]:focus { border-color: #1d9bf0; }

    .api-note {
      font-size: 0.8rem;
      color: #777;
      margin-top: 6px;
    }

    .save-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 0.875rem;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 9px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    .btn-primary { background: #1d9bf0; color: #fff; }
    .btn-secondary { background: #e7e7e7; color: #333; }

    #results {
      margin-top: 8px;
    }

    #results h1 { font-size: 1.5rem; margin: 20px 0 8px; }
    #results h2 { font-size: 1.2rem; margin: 18px 0 6px; border-bottom: 1px solid #e0e0e0; padding-bottom: 4px; }
    #results h3 { font-size: 1rem; margin: 14px 0 4px; }

    #results p { margin-bottom: 8px; }
    #results ul, #results ol { padding-left: 20px; margin-bottom: 8px; }
    #results li { margin-bottom: 4px; }

    #results table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 0.875rem;
    }

    #results th, #results td {
      border: 1px solid #ddd;
      padding: 6px 10px;
      text-align: left;
    }

    #results th { background: #f0f0f0; font-weight: 600; }
    #results tr:nth-child(even) td { background: #fafafa; }

    #results pre {
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      overflow-x: auto;
      margin-bottom: 10px;
    }

    #results code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85em;
      background: #f0f0f0;
      padding: 1px 4px;
      border-radius: 3px;
    }

    #results pre code {
      background: none;
      padding: 0;
      font-size: 0.85rem;
    }

    #results blockquote {
      border-left: 3px solid #ccc;
      padding-left: 12px;
      color: #555;
      margin: 8px 0;
    }

    #results hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 16px 0;
    }

    #results a { color: #1d9bf0; }

    .loading { color: #555; font-style: italic; }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      border-radius: 6px;
      padding: 12px 16px;
      color: #c0392b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>X Post Analyzer</h1>
      <p>Analyze a tweet against the real Twitter algorithm before you post.</p>
    </header>

    <div class="card">
      <form id="analyze-form">
        <label for="tweet-text">Tweet text</label>
        <textarea
          id="tweet-text"
          rows="6"
          placeholder="Paste your tweet here..."
          autofocus
          required
        ></textarea>

        <div class="media-group">
          <label class="group-label">Media type</label>
          <div class="radio-row">
            <label><input type="radio" name="media" value="none" checked> None</label>
            <label><input type="radio" name="media" value="image"> Image</label>
            <label><input type="radio" name="media" value="video"> Video</label>
            <label><input type="radio" name="media" value="gif"> GIF</label>
            <label><input type="radio" name="media" value="poll"> Poll</label>
          </div>
        </div>

        <div class="api-section">
          <label for="api-key">XAI_API_KEY (optional — enables Grok analysis)</label>
          <input type="password" id="api-key" placeholder="xai-...">
          <div class="save-row">
            <input type="checkbox" id="save-key">
            <label for="save-key" style="font-weight:400">Save key locally</label>
          </div>
          <p class="api-note">Key stays in your browser; never sent anywhere except api.x.ai.</p>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-primary">Analyze</button>
          <button type="button" id="clear-btn" class="btn-secondary">Clear</button>
        </div>
      </form>
    </div>

    <div id="results"></div>
  </div>

  <script type="module" src="/web/main.js"></script>
</body>
</html>
